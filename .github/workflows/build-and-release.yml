name: Build & Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:

  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Restore Packages
        run: dotnet restore src\ContinuousClearingTool.sln

      - name: Build
        run: dotnet build src\ContinuousClearingTool.sln

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: buildoutput
          path: ${{ github.workspace }}/out/net10.0
      
      - name: Upload Entire Output Directory
        uses: actions/upload-artifact@v4
        with:
          name: full-build-output
          path: ${{ github.workspace }}/out

  cdxgen-validation:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - projectType: npm
            sampleFolder: DemoProject/NPMProject
          # Add additional supported ecosystems here as sample fixtures become available, e.g.:
          # - projectType: nuget
          #   sampleFolder: DemoProject/NuGetProject
          # - projectType: maven
          #   sampleFolder: DemoProject/MavenProject
          # - projectType: poetry
          #   sampleFolder: DemoProject/PoetryProject
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cdxgen
        run: npm install -g @cyclonedx/cdxgen

      - name: Run cdxgen against ${{ matrix.projectType }} sample
        id: run_cdxgen
        continue-on-error: true
        run: |
          OUT_DIR=${{ github.workspace }}/cdxgen-output/${{ matrix.projectType }}
          mkdir -p "$OUT_DIR"
          cdxgen -t ${{ matrix.projectType }} -o "$OUT_DIR/cdx_dep.json" ${{ github.workspace }}/${{ matrix.sampleFolder }} \
            2>&1 | tee "$OUT_DIR/cdxgen.log"
          exit ${PIPESTATUS[0]}

      - name: Validate cdxgen Output
        id: validate_cdxgen
        if: steps.run_cdxgen.outcome == 'success'
        continue-on-error: true
        run: |
          OUT_DIR=${{ github.workspace }}/cdxgen-output/${{ matrix.projectType }}
          FILE="$OUT_DIR/cdx_dep.json"
          if [ ! -s "$FILE" ]; then
            echo "::error::cdxgen output file is missing or empty: $FILE"
            exit 1
          fi

          if ! jq empty "$FILE" 2>>"$OUT_DIR/cdxgen.log"; then
            echo "::error::cdxgen output is not valid JSON: $FILE"
            exit 1
          fi

          COMPONENT_COUNT=$(jq '.components | length' "$FILE")
          echo "cdxgen (${{ matrix.projectType }}) produced $COMPONENT_COUNT component(s)"
          if [ "$COMPONENT_COUNT" -lt 1 ]; then
            echo "::error::cdxgen output contains no components: $FILE"
            exit 1
          fi

          echo "CDXGen validation passed for ${{ matrix.projectType }}: $COMPONENT_COUNT components found."

      - name: Upload CDXGen Diagnostic Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdxgen-diagnostics-${{ matrix.projectType }}
          path: |
            ${{ github.workspace }}/cdxgen-output/${{ matrix.projectType }}/**
          if-no-files-found: warn

      - name: Fail Job if CDXGen Generation or Validation Failed
        if: steps.run_cdxgen.outcome == 'failure' || steps.validate_cdxgen.outcome == 'failure'
        run: |
          echo "::error::CDXGen dependency generation or validation failed for ${{ matrix.projectType }}. See cdxgen-diagnostics-${{ matrix.projectType }} artifact for details."
          exit 1

  build-docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: buildoutput
          path: ${{ github.workspace }}/out/net10.0

      - name: Build Docker Image
        run: |
          docker build . --file Dockerfile --tag ${{ github.repository }}:continuous-clearing-v11.1.1
          docker save ${{ github.repository }}:continuous-clearing-v11.1.1 -o continuous-clearing-v11.1.1.tar

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: docker-continuous-clearing
          path: |
            *.tar

  pack-nuget:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: buildoutput
          path: ${{ github.workspace }}/out/net10.0

      - name: Pack NuGet Package
        run: |
          nuget pack CA.nuspec -Version 11.1.1

      - name: Upload NuGet Package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-continuous-clearing
          path: |
            *.nupkg

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    needs: [build, build-docker, pack-nuget, cdxgen-validation]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download Full Build Output
        uses: actions/download-artifact@v4
        with:
          name: full-build-output
          path: ${{ github.workspace }}/out

      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-continuous-clearing

      - name: Download NuGet Package
        uses: actions/download-artifact@v4
        with:
          name: nuget-continuous-clearing

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v11.1.1
          release_name: Release v11.1.1
          body: |
            ${{ github.event.head_commit.message }}
          draft: true
          prerelease: false

      - name: Compress Full Build Output into ZIP
        run: |
          powershell -Command "& {Compress-Archive -Path ${{ github.workspace }}/out/* -DestinationPath ${{ github.workspace }}/continuous-clearing-v11.1.1.zip}"

      - name: Upload Full Build Output ZIP to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/continuous-clearing-v11.1.1.zip
          asset_name: continuous-clearing-v11.1.1.zip
          asset_content_type: application/zip

      - name: Upload Docker Image(tar) to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./continuous-clearing-v11.1.1.tar
          asset_name: continuous-clearing-v11.1.1.tar
          asset_content_type: application/x-tar

      - name: Upload NuGet Package to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./continuous-clearing.11.1.1.nupkg
          asset_name: continuous-clearing.11.1.1.nupkg
          asset_content_type: application/octet-stream

      - name: Upload ReadmeOSS_nupkg file to Release 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/ReadmeOSS_continuous-clearing_nupkg.html
          asset_name: ReadmeOSS_continuous-clearing_nupkg.html
          asset_content_type: text/html

      - name: Upload ReadmeOSS_Docker file to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/ReadmeOSS_continuous-clearing_DockerImage.html
          asset_name: ReadmeOSS_continuous-clearing_DockerImage.html
          asset_content_type: text/html
