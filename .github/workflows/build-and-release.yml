name: Build & Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'beta/**'
      - 'release/**'
      - 'hotfix/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to release from (used for hotfix releases without merging to main)'
        required: false
        default: ''

jobs:

  version:
    runs-on: windows-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      isPrerelease: ${{ steps.set_prerelease.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v0.10.2
        with:
          versionSpec: '5.12.0'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.10.2
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Determine Prerelease Flag
        id: set_prerelease
        shell: pwsh
        run: |
          $preTag = "${{ steps.gitversion.outputs.preReleaseTag }}"
          $isPre = if ($preTag) { "true" } else { "false" }
          Write-Host "SemVer: ${{ steps.gitversion.outputs.semVer }} | PreReleaseTag: $preTag | IsPrerelease: $isPre"
          echo "is_prerelease=$isPre" >> $env:GITHUB_OUTPUT

  build:
    runs-on: windows-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Restore Packages
        run: dotnet restore src\ContinuousClearingTool.sln

      - name: Build
        run: dotnet build src\ContinuousClearingTool.sln

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: buildoutput
          path: ${{ github.workspace }}/out/net10.0
      
      - name: Upload Entire Output Directory
        uses: actions/upload-artifact@v4
        with:
          name: full-build-output
          path: ${{ github.workspace }}/out

  build-docker:
    runs-on: ubuntu-latest
    needs: [build, version]
    env:
      SEMVER: ${{ needs.version.outputs.semVer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: buildoutput
          path: ${{ github.workspace }}/out/net10.0

      - name: Build Docker Image
        run: |
          docker build . --file Dockerfile --tag ${{ github.repository }}:continuous-clearing-v${{ env.SEMVER }}
          docker save ${{ github.repository }}:continuous-clearing-v${{ env.SEMVER }} -o continuous-clearing-v${{ env.SEMVER }}.tar

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: docker-continuous-clearing
          path: |
            *.tar

  pack-nuget:
    runs-on: windows-latest
    needs: [build, version]
    env:
      SEMVER: ${{ needs.version.outputs.semVer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: buildoutput
          path: ${{ github.workspace }}/out/net10.0

      - name: Pack NuGet Package
        run: |
          nuget pack CA.nuspec -Version ${{ env.SEMVER }}

      - name: Upload NuGet Package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-continuous-clearing
          path: |
            *.nupkg

  release:
    if: |
      startsWith(github.ref, 'refs/heads/main') ||
      startsWith(github.ref, 'refs/heads/hotfix/') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: [build, build-docker, pack-nuget, version]
    env:
      SEMVER: ${{ needs.version.outputs.semVer }}
      IS_PRERELEASE: ${{ needs.version.outputs.isPrerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Download Full Build Output
        uses: actions/download-artifact@v4
        with:
          name: full-build-output
          path: ${{ github.workspace }}/out

      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-continuous-clearing

      - name: Download NuGet Package
        uses: actions/download-artifact@v4
        with:
          name: nuget-continuous-clearing

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.SEMVER }}
          release_name: Release v${{ env.SEMVER }}
          body: |
            ${{ github.event.head_commit.message }}
          draft: ${{ env.IS_PRERELEASE == 'false' }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}

      - name: Compress Full Build Output into ZIP
        run: |
          powershell -Command "& {Compress-Archive -Path ${{ github.workspace }}/out/* -DestinationPath ${{ github.workspace }}/continuous-clearing-v${{ env.SEMVER }}.zip}"

      - name: Upload Full Build Output ZIP to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/continuous-clearing-v${{ env.SEMVER }}.zip
          asset_name: continuous-clearing-v${{ env.SEMVER }}.zip
          asset_content_type: application/zip

      - name: Upload Docker Image(tar) to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./continuous-clearing-v${{ env.SEMVER }}.tar
          asset_name: continuous-clearing-v${{ env.SEMVER }}.tar
          asset_content_type: application/x-tar

      - name: Upload NuGet Package to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./continuous-clearing.${{ env.SEMVER }}.nupkg
          asset_name: continuous-clearing.${{ env.SEMVER }}.nupkg
          asset_content_type: application/octet-stream

      - name: Upload ReadmeOSS_nupkg file to Release 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/ReadmeOSS_continuous-clearing_nupkg.html
          asset_name: ReadmeOSS_continuous-clearing_nupkg.html
          asset_content_type: text/html

      - name: Upload ReadmeOSS_Docker file to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/ReadmeOSS_continuous-clearing_DockerImage.html
          asset_name: ReadmeOSS_continuous-clearing_DockerImage.html
          asset_content_type: text/html
