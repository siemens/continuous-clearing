name: Build & Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'beta/**'
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to release from'
        required: false
        default: ''

jobs:

  version:
    runs-on: windows-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      isPrerelease: ${{ steps.set_prerelease.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@51d325634925d7d9ce0a7efc2c586c0bc2b9eee6 # v3.2.1
        with:
          versionSpec: '5.12.0'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@51d325634925d7d9ce0a7efc2c586c0bc2b9eee6 # v3.2.1
        with:
          configFilePath: GitVersion.yml
          disableCache: true

      - name: Determine Prerelease Flag
        id: set_prerelease
        shell: pwsh
        run: |
          $preTag = "${{ steps.gitversion.outputs.preReleaseTag }}"
          $isPre = if ($preTag) { "true" } else { "false" }
          Write-Host "SemVer: ${{ steps.gitversion.outputs.semVer }} | PreReleaseTag: $preTag | IsPrerelease: $isPre"
          echo "is_prerelease=$isPre" >> $env:GITHUB_OUTPUT

  build:
    runs-on: windows-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Restore Packages
        run: dotnet restore src\ContinuousClearingTool.sln

      - name: Build
        run: dotnet build src\ContinuousClearingTool.sln

      - name: Upload Build Output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildoutput
          path: ${{ github.workspace }}/out/net10.0

      - name: Upload Entire Output Directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-build-output
          path: ${{ github.workspace }}/out

  build-docker:
    runs-on: ubuntu-latest
    needs: [build, version]
    env:
      SEMVER: ${{ needs.version.outputs.semVer }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Download Build Output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: buildoutput
          path: ${{ github.workspace }}/out/net10.0

      - name: Build Docker Image
        run: |
          docker build . --file Dockerfile --tag ${{ github.repository }}:continuous-clearing-v${{ env.SEMVER }}
          docker save ${{ github.repository }}:continuous-clearing-v${{ env.SEMVER }} -o continuous-clearing-v${{ env.SEMVER }}.tar

      - name: Upload Docker Image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-continuous-clearing
          path: |
            *.tar

  pack-nuget:
    runs-on: windows-latest
    needs: [build, version]
    env:
      SEMVER: ${{ needs.version.outputs.semVer }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Download Build Output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: buildoutput
          path: ${{ github.workspace }}/out/net10.0

      - name: Pack NuGet Package
        run: |
          nuget pack CA.nuspec -Version ${{ env.SEMVER }}

      - name: Upload NuGet Package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-continuous-clearing
          path: |
            *.nupkg

  release:
    if: |
      startsWith(github.ref, 'refs/heads/main') ||
      startsWith(github.ref, 'refs/heads/beta/') ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: [build, build-docker, pack-nuget, version]
    env:
      SEMVER: ${{ needs.version.outputs.semVer }}
      IS_PRERELEASE: ${{ needs.version.outputs.isPrerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Download Full Build Output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: full-build-output
          path: ${{ github.workspace }}/out

      - name: Download Docker Image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-continuous-clearing

      - name: Download NuGet Package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-continuous-clearing

      - name: Check if version tag already exists
        id: check_tag
        shell: pwsh
        run: |
          $tag = "v${{ env.SEMVER }}"
          git fetch --tags
          $exists = (git tag -l $tag)
          if ($exists) {
            Write-Host "Tag $tag already exists on this commit history. Skipping release creation to avoid duplicate/escalating tags."
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Create Release
        id: create_release
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.SEMVER }}
          release_name: Release v${{ env.SEMVER }}
          body: |
            ${{ github.event.head_commit.message }}
          draft: ${{ env.IS_PRERELEASE == 'false' }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}

      - name: Compress Full Build Output into ZIP
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          powershell -Command "& {Compress-Archive -Path ${{ github.workspace }}/out/* -DestinationPath ${{ github.workspace }}/continuous-clearing-v${{ env.SEMVER }}.zip}"

      - name: Upload Full Build Output ZIP to Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/continuous-clearing-v${{ env.SEMVER }}.zip
          asset_name: continuous-clearing-v${{ env.SEMVER }}.zip
          asset_content_type: application/zip

      - name: Upload Docker Image(tar) to Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./continuous-clearing-v${{ env.SEMVER }}.tar
          asset_name: continuous-clearing-v${{ env.SEMVER }}.tar
          asset_content_type: application/x-tar

      - name: Upload NuGet Package to Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./continuous-clearing.${{ env.SEMVER }}.nupkg
          asset_name: continuous-clearing.${{ env.SEMVER }}.nupkg
          asset_content_type: application/octet-stream

      - name: Upload ReadmeOSS_nupkg file to Release 
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/ReadmeOSS_continuous-clearing_nupkg.html
          asset_name: ReadmeOSS_continuous-clearing_nupkg.html
          asset_content_type: text/html

      - name: Upload ReadmeOSS_Docker file to Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/ReadmeOSS_continuous-clearing_DockerImage.html
          asset_name: ReadmeOSS_continuous-clearing_DockerImage.html
          asset_content_type: text/html
